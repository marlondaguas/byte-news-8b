services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: byte_news_web
    restart: unless-stopped
    ports:
      - "${PORT_WEB}:80"
    depends_on:
      - api
    networks:
      - byte_news_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: byte_news_api
    restart: unless-stopped
    environment:
      - PORT=${PORT_API}
    volumes:
      - byte_news_data:/app/data
    networks:
      - byte_news_net

networks:
  byte_news_net:
    driver: bridge

volumes:
  byte_news_data: